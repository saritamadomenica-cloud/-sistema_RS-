<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Residuos Sólidos · Quito - Iniciar sesión</title>
  <script>
    (function () {
      try {
        var g = localStorage.getItem('tema');
        var t = g || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l2.5 4.3M9.5 7.3H4.7l2.4-4.2M4.7 7.3l-2.4 4.2M19.3 7.3l2.4 4.2-2.4 4.2M21.7 11.5H16.9"/>
            <path d="M6.7 16.7l-2.4-4.2M6.7 16.7h4.8M16.9 16.7l-2.4-4.2M16.9 16.7h-4.8M8.5 20.9l-3.4-5.8M15.5 20.9l3.4-5.8"/>
          </svg>
        </span>
        <div class="brand__text">
          <h1>Sistema de Residuos Sólidos</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <nav class="nav">
          <a href="registros.html" class="nav__link">Registros</a>
          <a href="detalle.html" class="nav__link">Detalle Zonal</a>
          <a href="index.html" class="nav__link">Indicadores Globales</a>
        </nav>
        <button id="btn-tema" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="login">
    <section class="card login__card">
      <header class="card__head">
        <div>
          <h2>Acceso de administradores</h2>
          <span class="card__hint">Ingrese con su cuenta institucional @municipioquito.gob.ec para gestionar registros</span>
        </div>
      </header>
      <form id="login-form" class="login__form">
        <label class="field">
          <span>Correo institucional</span>
          <input type="email" id="email" placeholder="usuario@municipioquito.gob.ec" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="login__error" hidden></p>
        <button type="submit" class="btn btn--primary" id="btn-entrar">Iniciar sesión</button>
        <p class="login__nota">Las personas naturales pueden consultar los indicadores globales y el detalle zonal sin iniciar sesión.</p>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const redir = params.get('redir') || 'index.html';

      try {
        if (localStorage.getItem('token_admin')) { location.replace(redir); return; }
      } catch (e) {}

      const form = document.getElementById('login-form');
      const err = document.getElementById('login-error');
      const btn = document.getElementById('btn-entrar');

      form.addEventListener('submit', async e => {
        e.preventDefault();
        err.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Verificando…';
        try {
          const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value
            })
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'No se pudo iniciar sesión');
          try {
            localStorage.setItem('token_admin', d.token);
            localStorage.setItem('correo_admin', d.email);
          } catch (e2) {}
          location.replace(redir);
        } catch (ex) {
          err.textContent = ex.message;
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
        }
      });
    })();
  </script>
</body>
</html>
