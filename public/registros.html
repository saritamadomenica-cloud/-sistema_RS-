<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Residuos Sólidos · Quito - Registros</title>
  <script>
    (function () {
      try {
        var g = localStorage.getItem('tema');
        var t = g || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l2.5 4.3M9.5 7.3H4.7l2.4-4.2M4.7 7.3l-2.4 4.2M19.3 7.3l2.4 4.2-2.4 4.2M21.7 11.5H16.9"/>
            <path d="M6.7 16.7l-2.4-4.2M6.7 16.7h4.8M16.9 16.7l-2.4-4.2M16.9 16.7h-4.8M8.5 20.9l-3.4-5.8M15.5 20.9l3.4-5.8"/>
          </svg>
        </span>
        <div class="brand__text">
          <h1>Sistema de Residuos Sólidos</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <nav class="nav">
          <a href="registros.html" class="nav__link nav__link--active">Registros</a>
          <a href="detalle.html" class="nav__link">Detalle Zonal</a>
          <a href="index.html" class="nav__link">Indicadores Globales</a>
        </nav>
        <button id="btn-tema" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
        <div id="auth-box" class="auth-box"></div>
        <button id="btn-nuevo" class="btn btn--primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo registro
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <header class="card__head card__head--row">
        <div>
          <h2>Registros</h2>
          <span class="card__hint">Explora, edita o elimina los registros cargados</span>
        </div>
        <span id="contador" class="pill">0 registros</span>
      </header>

      <div class="filters">
        <label class="field">
          <span>Administración zonal</span>
          <select id="f-zonal"><option value="">Todas las zonales</option></select>
        </label>
        <label class="field">
          <span>Año</span>
          <select id="f-anio"><option value="">Todos los años</option></select>
        </label>
        <label class="field">
          <span>Zona</span>
          <select id="f-zona"><option value="">Urbana y Rural</option><option>Urbana</option><option>Rural</option></select>
        </label>
        <label class="field field--grow">
          <span>Buscar</span>
          <input type="search" id="f-buscar" placeholder="Buscar por zonal, tipo, valor (ej. Calderón, 89%)…">
        </label>
        <button type="button" id="btn-limpiar" class="btn btn--ghost">Limpiar filtros</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Año</th><th>Administración zonal</th><th>Zona</th><th class="num">Toneladas (kg)</th>
            <th class="num">Denuncias</th><th class="num">Cumpl. %</th><th class="num">Reseñas %</th><th class="acciones"></th>
          </tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="modal" class="modal">
    <form id="form" method="dialog">
      <header class="modal__head">
        <h3 id="modal-titulo">Registro</h3>
        <p class="card__hint">Completa la información del registro</p>
      </header>
      <input type="hidden" id="id">
      <div class="form-grid">
        <label class="field"><span>Fecha</span><input type="date" id="fecha" required></label>
        <label class="field"><span>Administración zonal</span><select id="zonal" required></select></label>
        <label class="field"><span>Zona</span><select id="zona"><option>Urbana</option><option>Rural</option></select></label>
        <label class="field"><span>Tipo de recolección</span><select id="tipo"></select></label>
        <label class="field"><span>Frecuencia</span><select id="frecuencia"></select></label>
        <label class="field"><span>Toneladas generadas (kg)</span><input type="number" step="any" min="0" id="kg" required></label>
        <label class="field"><span>Denuncias atendidas</span><input type="number" min="0" id="denuncias"></label>
        <label class="field"><span>Cumplimiento (%)</span><input type="number" step="any" min="0" max="100" id="cumplimiento"></label>
        <label class="field"><span>Buenas reseñas (%)</span><input type="number" step="any" min="0" max="100" id="resenas"></label>
      </div>
      <menu class="modal__actions">
        <button type="button" id="btn-cancelar" class="btn btn--ghost">Cancelar</button>
        <button type="submit" class="btn btn--primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="confirm" class="modal modal--sm">
    <div class="confirm">
      <span class="confirm__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
        </svg>
      </span>
      <h3 id="confirm-titulo">Confirmar</h3>
      <p id="confirm-msg"></p>
    </div>
    <menu class="modal__actions">
      <button type="button" id="confirm-no" class="btn btn--ghost">Cancelar</button>
      <button type="button" id="confirm-si" class="btn btn--danger">Eliminar</button>
    </menu>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
